[package]
name = "routing-console"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time", "sync", "net", "signal"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = { version = "0.1.19", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time", "sync", "net", "signal", "test-util"] }

[workspace]
members = [".", "tools/check", "tools/check-all"]
default-members = ["."]
resolver = "3"
